<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admins — Super Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../../css/styles.css" />
</head>
<body class="font-body text-ink-900">
<div id="shellSlot"></div>
<script src="../../js/mockData.js"></script>
<script src="../../js/dev-config.js"></script>
<script src="../../js/api.js"></script>
<script>App.session.requireSuperAdminOrRedirect();</script>
<script src="../../js/components/sheetsAndToasts.js"></script>
<script src="../../js/components/superShell.js"></script>
<script>
(function () {
  document.getElementById('shellSlot').innerHTML =
    App.components.superShell('admins', 'Admins', 'Manage event admins');

  const el = document.getElementById('superPageContent');
  let allAdmins = [];
  let filterRole = '';
  let searchQ = '';

  function roleBadge(role) {
    return role === 'super_admin'
      ? `<span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-purple-100 text-purple-700">Super Admin</span>`
      : `<span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">Event Admin</span>`;
  }

  function render() {
    const list = allAdmins.filter(a => {
      const matchRole   = !filterRole || a.role === filterRole || (filterRole === 'disabled' && !a.is_active);
      const matchSearch = !searchQ || a.name.toLowerCase().includes(searchQ.toLowerCase()) || a.email.toLowerCase().includes(searchQ.toLowerCase());
      return matchRole && matchSearch;
    });

    el.innerHTML = `
    <div class="flex flex-wrap gap-3 mb-5">
      <input id="adminSearch" type="search" placeholder="Search admins…" value="${searchQ}"
        class="flex-1 min-w-[180px] rounded-xl border border-ink-200 px-4 py-2 text-sm" />
      <div class="flex gap-1 flex-wrap">
        ${['','super_admin','event_admin','disabled'].map(r => `
          <button data-role="${r}" class="role-filter px-3 py-1.5 rounded-xl text-xs font-semibold border transition-colors
            ${filterRole === r ? 'bg-ink-900 text-white border-ink-900' : 'border-ink-200 text-ink-600 hover:border-ink-400'}">
            ${r === '' ? 'All' : r === 'super_admin' ? 'Super Admin' : r === 'event_admin' ? 'Event Admin' : 'Disabled'}
          </button>`).join('')}
      </div>
      <button id="openCreateAdmin" class="px-4 py-2 rounded-xl bg-primary-500 text-white text-sm font-semibold">+ Create Admin</button>
    </div>

    ${list.length === 0 ? '<p class="text-ink-400 text-sm py-8 text-center">No admins found.</p>' : `
    <div class="bg-white rounded-2xl border border-ink-100 shadow-soft overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-[12px] font-semibold text-ink-400 border-b border-ink-100">
          <th class="px-5 py-3">Name</th><th class="px-5 py-3">Email</th>
          <th class="px-5 py-3">Role</th><th class="px-5 py-3">Status</th>
          <th class="px-5 py-3">Events</th><th class="px-5 py-3">Last Login</th>
          <th class="px-5 py-3">Actions</th>
        </tr></thead>
        <tbody>
          ${list.map(a => `
          <tr class="border-b border-ink-50 hover:bg-sand/50">
            <td class="px-5 py-3 font-semibold">${a.name}</td>
            <td class="px-5 py-3 text-ink-500">${a.email}</td>
            <td class="px-5 py-3">${roleBadge(a.role)}</td>
            <td class="px-5 py-3">
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${a.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}">
                ${a.is_active ? 'Active' : 'Disabled'}
              </span>
            </td>
            <td class="px-5 py-3">${a.assigned_event_count}</td>
            <td class="px-5 py-3 text-ink-400">${a.last_login_at ? new Date(a.last_login_at).toLocaleDateString() : '—'}</td>
            <td class="px-5 py-3">
              <div class="flex gap-2 flex-wrap">
                <button data-edit="${a.id}" class="text-xs font-semibold text-primary-600 hover:underline">Edit</button>
                <button data-reset="${a.id}" class="text-xs font-semibold text-ink-500 hover:underline">Reset PW</button>
                ${a.is_active
                  ? `<button data-disable="${a.id}" class="text-xs font-semibold text-red-500 hover:underline">Disable</button>`
                  : `<button data-enable="${a.id}" class="text-xs font-semibold text-green-600 hover:underline">Enable</button>`}
              </div>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`}

    <!-- Create Admin Modal -->
    <div id="createAdminModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 hidden">
      <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-6 space-y-4">
        <h2 class="font-display font-semibold text-xl">Create Event Admin</h2>
        <div id="createAdminError" class="hidden text-sm text-red-600 bg-red-50 rounded-xl px-4 py-2"></div>
        <div><label class="label">Name *</label><input id="ca_name" class="input" /></div>
        <div><label class="label">Email *</label><input id="ca_email" type="email" class="input" /></div>
        <div><label class="label">Password *</label><input id="ca_password" type="password" class="input" /></div>
        <div><label class="label">Role</label>
          <select id="ca_role" class="input">
            <option value="event_admin">Event Admin</option>
            <option value="super_admin">Super Admin</option>
          </select>
        </div>
        <div class="flex gap-3 pt-2">
          <button id="createAdminCancel" class="flex-1 py-2.5 rounded-2xl border border-ink-200 text-sm font-semibold">Cancel</button>
          <button id="createAdminSubmit" class="flex-1 py-2.5 rounded-2xl bg-ink-900 text-white text-sm font-semibold">Create</button>
        </div>
      </div>
    </div>

    <!-- Reset Password Modal -->
    <div id="resetPwModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 hidden">
      <div class="bg-white rounded-3xl shadow-xl w-full max-w-sm p-6 space-y-4">
        <h2 class="font-display font-semibold text-xl">Reset Password</h2>
        <div id="resetPwError" class="hidden text-sm text-red-600 bg-red-50 rounded-xl px-4 py-2"></div>
        <input id="rp_password" type="password" placeholder="New password (min 8 chars)" class="input w-full" />
        <div class="flex gap-3">
          <button id="resetPwCancel" class="flex-1 py-2.5 rounded-2xl border border-ink-200 text-sm font-semibold">Cancel</button>
          <button id="resetPwSubmit" class="flex-1 py-2.5 rounded-2xl bg-ink-900 text-white text-sm font-semibold">Reset</button>
        </div>
      </div>
    </div>`;

    // Bind
    document.getElementById('adminSearch').addEventListener('input', e => { searchQ = e.target.value; render(); });
    document.querySelectorAll('.role-filter').forEach(btn => {
      btn.addEventListener('click', () => { filterRole = btn.dataset.role; render(); });
    });

    document.getElementById('openCreateAdmin').addEventListener('click', () => {
      document.getElementById('createAdminModal').classList.remove('hidden');
    });
    document.getElementById('createAdminCancel').addEventListener('click', () => {
      document.getElementById('createAdminModal').classList.add('hidden');
    });
    document.getElementById('createAdminSubmit').addEventListener('click', async () => {
      const errEl = document.getElementById('createAdminError');
      errEl.classList.add('hidden');
      try {
        await App.api.superCreateAdmin({
          name:     document.getElementById('ca_name').value.trim(),
          email:    document.getElementById('ca_email').value.trim(),
          password: document.getElementById('ca_password').value,
          role:     document.getElementById('ca_role').value,
        });
        document.getElementById('createAdminModal').classList.add('hidden');
        await load();
      } catch (e) { errEl.textContent = e.message; errEl.classList.remove('hidden'); }
    });

    let resetTargetId = null;
    document.querySelectorAll('[data-reset]').forEach(btn => {
      btn.addEventListener('click', () => {
        resetTargetId = btn.dataset.reset;
        document.getElementById('rp_password').value = '';
        document.getElementById('resetPwModal').classList.remove('hidden');
      });
    });
    document.getElementById('resetPwCancel').addEventListener('click', () => {
      document.getElementById('resetPwModal').classList.add('hidden');
    });
    document.getElementById('resetPwSubmit').addEventListener('click', async () => {
      const errEl = document.getElementById('resetPwError');
      errEl.classList.add('hidden');
      try {
        await App.api.superResetPassword(resetTargetId, document.getElementById('rp_password').value);
        document.getElementById('resetPwModal').classList.add('hidden');
      } catch (e) { errEl.textContent = e.message; errEl.classList.remove('hidden'); }
    });

    document.querySelectorAll('[data-disable]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Disable this admin? Their active sessions will be revoked.')) return;
        try { await App.api.superDisableAdmin(btn.dataset.disable); await load(); }
        catch (e) { alert(e.message); }
      });
    });
    document.querySelectorAll('[data-enable]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try { await App.api.superEnableAdmin(btn.dataset.enable); await load(); }
        catch (e) { alert(e.message); }
      });
    });
    document.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => openEditModal(btn.dataset.edit));
    });
  }

  async function openEditModal(id) {
    let admin;
    try { admin = await App.api.superGetAdmin(id); }
    catch (e) { alert('Failed to load admin: ' + e.message); return; }

    // Inject edit modal if not present
    if (!document.getElementById('editAdminModal')) {
      document.body.insertAdjacentHTML('beforeend', `
        <div id="editAdminModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
          <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-6 space-y-4">
            <h2 class="font-display font-semibold text-xl">Edit Admin</h2>
            <div id="editAdminError" class="hidden text-sm text-red-600 bg-red-50 rounded-xl px-4 py-2"></div>
            <div><label class="label">Name *</label><input id="ea_name" class="input" /></div>
            <div><label class="label">Email *</label><input id="ea_email" type="email" class="input" /></div>
            <div><label class="label">Role</label>
              <select id="ea_role" class="input">
                <option value="event_admin">Event Admin</option>
                <option value="super_admin">Super Admin</option>
              </select>
            </div>
            <div class="flex gap-3 pt-2">
              <button id="editAdminCancel" class="flex-1 py-2.5 rounded-2xl border border-ink-200 text-sm font-semibold">Cancel</button>
              <button id="editAdminSubmit" class="flex-1 py-2.5 rounded-2xl bg-ink-900 text-white text-sm font-semibold">Save</button>
            </div>
          </div>
        </div>`);
    }

    const modal = document.getElementById('editAdminModal');
    modal.classList.remove('hidden');
    document.getElementById('ea_name').value  = admin.name;
    document.getElementById('ea_email').value = admin.email;
    document.getElementById('ea_role').value  = admin.role;
    document.getElementById('editAdminError').classList.add('hidden');

    document.getElementById('editAdminCancel').onclick = () => modal.classList.add('hidden');
    document.getElementById('editAdminSubmit').onclick = async () => {
      const errEl = document.getElementById('editAdminError');
      errEl.classList.add('hidden');
      try {
        await App.api.superUpdateAdmin(id, {
          name:  document.getElementById('ea_name').value.trim(),
          email: document.getElementById('ea_email').value.trim(),
          role:  document.getElementById('ea_role').value,
        });
        modal.classList.add('hidden');
        await load();
      } catch (e) { errEl.textContent = e.message; errEl.classList.remove('hidden'); }
    };
  }

  async function load() {
    try { allAdmins = await App.api.superListAdmins(); render(); }
    catch (e) { el.innerHTML = `<p class="text-red-500">Failed to load: ${e.message}</p>`; }
  }

  load();
})();
</script>
<style>
.label { display:block; font-size:13px; font-weight:600; color:#6b6560; margin-bottom:4px; }
.input { width:100%; border-radius:12px; border:1px solid #e5e2df; padding:8px 14px; font-size:14px; }
</style>
</body>
</html>
