<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Detail — Super Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../../css/styles.css" />
</head>
<body class="font-body text-ink-900">
<div id="shellSlot"></div>
<script src="../../js/mockData.js"></script>
<script src="../../js/dev-config.js"></script>
<script src="../../js/api.js"></script>
<script>App.session.requireSuperAdminOrRedirect();</script>
<script src="../../js/components/sheetsAndToasts.js"></script>
<script src="../../js/components/superShell.js"></script>
<script>
(function () {
  document.getElementById('shellSlot').innerHTML =
    App.components.superShell('events', 'Event Detail', '');

  const el  = document.getElementById('superPageContent');
  const id  = new URLSearchParams(window.location.search).get('id');
  if (!id) { el.innerHTML = '<p class="text-red-500">No event ID provided.</p>'; return; }

  let event = null;
  let allEventAdmins = [];

  async function load() {
    try {
      [event, allEventAdmins] = await Promise.all([
        App.api.superGetEvent(id),
        App.api.superListAdmins({ role: 'event_admin', is_active: 1 }),
      ]);
      render();
    } catch (e) {
      el.innerHTML = `<p class="text-red-500">Failed to load: ${e.message}</p>`;
    }
  }

  function statusBadge(s) {
    const map = { active:'bg-green-100 text-green-700', draft:'bg-yellow-100 text-yellow-700',
                  archived:'bg-ink-100 text-ink-500', disabled:'bg-red-100 text-red-600' };
    return `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ${map[s]||'bg-ink-100'}">${s}</span>`;
  }

  function render() {
    const assignedIds = new Set((event.admins || []).map(a => String(a.id)));
    const unassigned  = allEventAdmins.filter(a => !assignedIds.has(String(a.id)));

    el.innerHTML = `
    <a href="events.html" class="text-sm text-primary-600 hover:underline mb-4 inline-block">← Back to Events</a>

    <div class="grid lg:grid-cols-2 gap-6">
      <!-- Event Info -->
      <div class="bg-white rounded-2xl border border-ink-100 shadow-soft p-6 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="font-display font-semibold text-lg">${event.name}</h2>
          <div class="flex items-center gap-2">
            ${statusBadge(event.status)}
            ${event.status !== 'active' ? `<button id="activateBtn" class="text-xs font-semibold px-3 py-1 rounded-full bg-green-600 text-white hover:bg-green-700">Set Active</button>` : ''}
            ${event.status === 'active' ? `<button id="archiveBtn" class="text-xs font-semibold px-3 py-1 rounded-full bg-ink-200 text-ink-600 hover:bg-ink-300">Archive</button>` : ''}
          </div>
        </div>
        <p class="text-ink-500 text-sm">${event.description || '—'}</p>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div><span class="text-ink-400">Slug</span><p class="font-mono">${event.slug}</p></div>
          <div><span class="text-ink-400">Date</span><p>${event.date || '—'}</p></div>
          <div><span class="text-ink-400">Location</span><p>${event.location || '—'}</p></div>
          <div><span class="text-ink-400">Guests</span><p>${event.guest_count}</p></div>
          <div><span class="text-ink-400">Photos</span><p>${event.photo_count}</p></div>
          <div><span class="text-ink-400">Videos</span><p>${event.video_count}</p></div>
        </div>
      </div>

      <!-- Assigned Admins -->
      <div class="bg-white rounded-2xl border border-ink-100 shadow-soft p-6">
        <h2 class="font-display font-semibold text-lg mb-4">Assigned Admins</h2>
        <div id="assignedList" class="space-y-2 mb-4">
          ${(event.admins || []).length === 0
            ? '<p class="text-ink-400 text-sm">No admins assigned yet.</p>'
            : (event.admins || []).map(a => `
              <div class="flex items-center justify-between py-2 border-b border-ink-50">
                <div>
                  <p class="font-semibold text-sm">${a.name}</p>
                  <p class="text-ink-400 text-xs">${a.email}</p>
                </div>
                <button data-remove="${a.id}" class="text-xs font-semibold text-red-500 hover:underline">Remove</button>
              </div>`).join('')}
        </div>

        ${unassigned.length > 0 ? `
        <div class="flex gap-2 mt-4">
          <select id="assignSelect" class="flex-1 rounded-xl border border-ink-200 px-3 py-2 text-sm">
            <option value="">Select admin to assign…</option>
            ${unassigned.map(a => `<option value="${a.id}">${a.name} (${a.email})</option>`).join('')}
          </select>
          <button id="assignBtn" class="px-4 py-2 rounded-xl bg-ink-900 text-white text-sm font-semibold">Assign</button>
        </div>
        <div id="assignErr" class="hidden mt-2 text-sm text-red-600"></div>` : '<p class="text-ink-400 text-xs mt-2">All active event admins are already assigned.</p>'}
      </div>
    </div>`;

    document.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remove this admin from the event?')) return;
        try { await App.api.superRemoveAdmin(id, btn.dataset.remove); await load(); }
        catch (e) { alert(e.message); }
      });
    });

    document.getElementById('activateBtn')?.addEventListener('click', async () => {
      try { await App.api.superUpdateEvent(id, { status: 'active' }); await load(); App.ui.toast('Event set to active.'); }
      catch (e) { App.ui.toast(e.message, 'error'); }
    });

    document.getElementById('archiveBtn')?.addEventListener('click', async () => {
      if (!confirm('Archive this event? Guests will no longer be able to access it.')) return;
      try { await App.api.superUpdateEvent(id, { status: 'archived' }); await load(); App.ui.toast('Event archived.'); }
      catch (e) { App.ui.toast(e.message, 'error'); }
    });

    document.getElementById('assignBtn')?.addEventListener('click', async () => {
      const adminId = document.getElementById('assignSelect').value;
      const errEl   = document.getElementById('assignErr');
      errEl.classList.add('hidden');
      if (!adminId) { errEl.textContent = 'Select an admin first.'; errEl.classList.remove('hidden'); return; }
      try { await App.api.superAssignAdmin(id, adminId); await load(); }
      catch (e) { errEl.textContent = e.message; errEl.classList.remove('hidden'); }
    });
  }

  load();
})();
</script>
</body>
</html>
