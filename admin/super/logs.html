<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Activity Logs — Super Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../../css/styles.css" />
</head>
<body class="font-body text-ink-900">
<div id="shellSlot"></div>
<script src="../../js/mockData.js"></script>
<script src="../../js/dev-config.js"></script>
<script src="../../js/api.js"></script>
<script>App.session.requireSuperAdminOrRedirect();</script>
<script src="../../js/components/sheetsAndToasts.js"></script>
<script src="../../js/components/superShell.js"></script>
<script>
(function () {
  document.getElementById('shellSlot').innerHTML =
    App.components.superShell('logs', 'Activity Logs', 'Audit trail for all admin actions');

  const el = document.getElementById('superPageContent');
  let filters = { action: '', from: '', to: '', limit: 50, offset: 0 };

  async function load() {
    try {
      const params = {};
      if (filters.action) params.action = filters.action;
      if (filters.from)   params.from   = filters.from;
      if (filters.to)     params.to     = filters.to;
      params.limit  = filters.limit;
      params.offset = filters.offset;
      const logs = await App.api.superListLogs(params);
      render(logs);
    } catch (e) {
      el.innerHTML = `<p class="text-red-500">Failed to load: ${e.message}</p>`;
    }
  }

  function render(logs) {
    el.innerHTML = `
    <div class="flex flex-wrap gap-3 mb-5">
      <input id="actionFilter" type="text" placeholder="Filter by action…" value="${filters.action}"
        class="rounded-xl border border-ink-200 px-4 py-2 text-sm" />
      <input id="fromFilter" type="date" value="${filters.from}"
        class="rounded-xl border border-ink-200 px-3 py-2 text-sm" />
      <input id="toFilter" type="date" value="${filters.to}"
        class="rounded-xl border border-ink-200 px-3 py-2 text-sm" />
      <button id="applyFilters" class="px-4 py-2 rounded-xl bg-ink-900 text-white text-sm font-semibold">Apply</button>
    </div>
    ${logs.length === 0 ? '<p class="text-ink-400 text-sm py-8 text-center">No logs found.</p>' : `
    <div class="bg-white rounded-2xl border border-ink-100 shadow-soft overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-[12px] font-semibold text-ink-400 border-b border-ink-100">
          <th class="px-5 py-3">Time</th><th class="px-5 py-3">Admin</th>
          <th class="px-5 py-3">Action</th><th class="px-5 py-3">Event</th>
          <th class="px-5 py-3">Description</th><th class="px-5 py-3">IP</th>
        </tr></thead>
        <tbody>
          ${logs.map(l => `
          <tr class="border-b border-ink-50 hover:bg-sand/50">
            <td class="px-5 py-3 text-ink-400 whitespace-nowrap">${new Date(l.created_at).toLocaleString()}</td>
            <td class="px-5 py-3">${l.admin_name || '—'}</td>
            <td class="px-5 py-3"><span class="font-mono text-xs bg-ink-100 px-2 py-0.5 rounded">${l.action}</span></td>
            <td class="px-5 py-3 text-ink-500">${l.event_name || '—'}</td>
            <td class="px-5 py-3 text-ink-500">${l.description || '—'}</td>
            <td class="px-5 py-3 text-ink-400 font-mono text-xs">${l.ip_address || '—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`}`;

    document.getElementById('applyFilters').addEventListener('click', () => {
      filters.action = document.getElementById('actionFilter').value.trim();
      filters.from   = document.getElementById('fromFilter').value;
      filters.to     = document.getElementById('toFilter').value;
      filters.offset = 0;
      load();
    });
  }

  load();
})();
</script>
</body>
</html>
