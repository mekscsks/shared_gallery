<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Admin Dashboard</title>
<meta name="theme-color" content="#1A1310" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../../css/styles.css" />
</head>
<body class="font-body text-ink-900">
<div id="shellSlot"></div>
<script src="../../js/mockData.js"></script>
<script src="../../js/dev-config.js"></script>
<script src="../../js/api.js"></script>
<script>App.session.requireSuperAdminOrRedirect();</script>
<script src="../../js/components/sheetsAndToasts.js"></script>
<script src="../../js/components/superShell.js"></script>
<script>
(async function () {
  document.getElementById('shellSlot').innerHTML =
    App.components.superShell('dashboard', 'Dashboard', 'System-wide overview');

  const el = document.getElementById('superPageContent');
  el.innerHTML = `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4" id="statGrid">
    <div class="col-span-full text-ink-400 text-sm">Loading…</div></div>
    <div class="mt-8" id="recentLogs"></div>`;

  try {
    const [stats, logs] = await Promise.all([
      App.api.superDashboard(),
      App.api.superListLogs({ limit: 10 }),
    ]);

    const card = (label, value, icon, tint) => `
      <div class="bg-white rounded-2xl border border-ink-100 p-5 shadow-soft">
        <span class="w-10 h-10 rounded-xl ${tint} grid place-items-center text-lg mb-3">${icon}</span>
        <p class="font-display font-semibold text-2xl">${value}</p>
        <p class="text-[13px] text-ink-400 mt-0.5">${label}</p>
      </div>`;

    document.getElementById('statGrid').innerHTML =
      card('Total Events',   stats.events.total,    '📅', 'bg-blue-50')  +
      card('Active Events',  stats.events.active,   '✅', 'bg-green-50') +
      card('Draft Events',   stats.events.draft,    '📝', 'bg-yellow-50')+
      card('Archived',       stats.events.archived, '📦', 'bg-ink-50')   +
      card('Event Admins',   stats.admins.total,    '👤', 'bg-purple-50')+
      card('Guests',         stats.guests,          '🙋', 'bg-pink-50')  +
      card('Photos',         stats.photos,          '🖼️', 'bg-orange-50')+
      card('Videos',         stats.videos,          '🎬', 'bg-red-50')   +
      card('Storage (MB)',   stats.storageMb,       '💾', 'bg-teal-50');

    const logRows = logs.map(l => `
      <tr class="border-b border-ink-100 text-sm">
        <td class="py-2.5 pr-4 text-ink-400 whitespace-nowrap">${new Date(l.created_at).toLocaleString()}</td>
        <td class="py-2.5 pr-4 font-medium">${l.admin_name || '—'}</td>
        <td class="py-2.5 pr-4"><span class="font-mono text-xs bg-ink-100 px-2 py-0.5 rounded">${l.action}</span></td>
        <td class="py-2.5 text-ink-500">${l.description || '—'}</td>
      </tr>`).join('');

    document.getElementById('recentLogs').innerHTML = `
      <h2 class="font-display font-semibold text-lg mb-3">Recent Activity</h2>
      <div class="bg-white rounded-2xl border border-ink-100 shadow-soft overflow-x-auto">
        <table class="w-full px-5 py-2">
          <thead><tr class="text-left text-[12px] font-semibold text-ink-400 border-b border-ink-100">
            <th class="px-5 py-3">Time</th><th class="px-5 py-3">Admin</th>
            <th class="px-5 py-3">Action</th><th class="px-5 py-3">Description</th>
          </tr></thead>
          <tbody class="px-5">${logRows || '<tr><td colspan="4" class="px-5 py-4 text-ink-400">No activity yet.</td></tr>'}</tbody>
        </table>
      </div>`;
  } catch (e) {
    el.innerHTML = `<p class="text-red-500">Failed to load dashboard: ${e.message}</p>`;
  }
})();
</script>
</body>
</html>
