services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shared-event-gallery-app

    ports:
      - "8081:80"

    environment:
      APP_TIMEZONE: Asia/Manila

      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: shared_event_gallery
      DB_USERNAME: gallery
      DB_PASSWORD: gallery_password

      CORS_ALLOWED_ORIGINS: http://localhost:8080

    volumes:
      - ./backend/storage:/var/www/html/backend/storage

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  db:
    image: mariadb:11.4

    container_name: shared-event-gallery-db

    environment:
      MARIADB_DATABASE: shared_event_gallery
      MARIADB_USER: gallery
      MARIADB_PASSWORD: gallery_password
      MARIADB_ROOT_PASSWORD: change_this_root_password

    volumes:
      - mariadb_data:/var/lib/mysql

    ports:
      - "3307:3306"

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:
  mariadb_data:services:

