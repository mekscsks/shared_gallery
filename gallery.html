<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gallery — RCY Training 2026</title>
<meta name="theme-color" content="#FFFBF8" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-cream font-body text-ink-900 min-h-screen pb-24 sm:pb-12">

  <div id="headerSlot"></div>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 pt-5">
    <div class="flex items-start justify-between gap-4 mb-4">
      <div>
        <h1 class="font-display font-semibold text-2xl sm:text-3xl text-ink-900">Memories</h1>
        <p class="text-ink-400 text-sm mt-0.5">Share the moments. Keep the memories.</p>
      </div>
      <button type="button" data-open="eventInfoModal" class="hidden sm:grid shrink-0 w-11 h-11 rounded-full bg-white border border-ink-100 shadow-soft place-items-center text-ink-500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
      </button>
    </div>

    <div class="flex items-center justify-between gap-3 mb-5">
      <div id="desktopTabsSlot"></div>
      <div id="filterChipsSlot" class="flex items-center gap-2 overflow-x-auto no-scrollbar"></div>
    </div>

    <div class="flex items-center gap-2.5 mb-5">
      <button id="shareMemoryInline" type="button" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-2 bg-primary-500 hover:bg-primary-600 text-white font-semibold text-sm py-3 px-4 rounded-2xl shadow-soft active:scale-[.98] transition-all">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Share a Memory
      </button>
      <a id="photoStripCta" href="photostrip.html" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-2 bg-white border border-ink-200 hover:border-gold-500 text-ink-700 font-semibold text-sm py-3 px-4 rounded-2xl shadow-soft transition-colors">
        <span aria-hidden="true">\ud83d\udcf7</span> Create Photo Strip
      </a>
    </div>

    <div id="galleryGridSlot"></div>
  </main>

  <div id="bottomNavSlot"></div>
  <div id="shareMemoryFabSlot"></div>
  <div id="uploadModalSlot"></div>
  <div id="moreSheetSlot"></div>
  <div id="eventInfoModalSlot"></div>
  <div id="lightboxSlot"></div>

<script src="js/mockData.js"></script>
<script src="js/api.js"></script>
<script src="js/components/header.js"></script>
<script src="js/components/bottomNav.js"></script>
<script src="js/components/sheetsAndToasts.js"></script>
<script src="js/components/galleryGrid.js"></script>
<script src="js/components/uploadModal.js"></script>
<script src="js/pages/gallery.js"></script>
</body>
</html>
